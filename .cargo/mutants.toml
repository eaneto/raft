# cargo-mutants configuration.
#
# Each exclusion is an *equivalent* mutant: no input can tell the mutated code
# from the original, so no test can catch it. Every entry says why. Patterns
# omit line numbers so they survive edits; each one matches exactly the
# mutants named in its comment (check with `cargo mutants --list`).
exclude_re = [
    # `args.term > currentTerm` -> `>=`: at an equal term `become_follower` is
    # a no-op on a follower, and a leader seeing a same-term leader would break
    # Election Safety. `leader_commit > commitIndex` -> `>=` re-assigns the
    # same commitIndex, and applying through it is then a no-op.
    'replace > with >= in RaftNode::handle_append_entries$',
    # Same term argument as for AppendEntries.
    'replace > with >= in RaftNode::handle_install_snapshot$',
    # Compacting at the current base is already a no-op inside `Log::compact`.
    'replace > with >= in RaftNode::handle_compact_log$',
    # Re-committing the current commitIndex: nothing new to apply, and a
    # committed config change was already finished when it first committed.
    'replace > with >= in RaftNode::maybe_advance_commit_index$',

    # src/storage/file.rs
    #
    # A 28-byte snapshot file has no room for its configuration, so it is
    # `Corrupt` whether the length check or the config decode rejects it.
    'replace < with <= in FileStorage::load_snapshot$',
    # With nothing to drop, `drop_log_prefix(0, ..)` rewrites the log with the
    # same contents: the result is identical, only slower.
    'replace > with >= in <impl Storage for FileStorage>::load$',
    'replace > with >= in <impl Storage for FileStorage>::persist_snapshot$',
    # Only logs; what it logs comes from `filesystem_of`, which is tested.
    'replace warn_if_unusual_filesystem with \(\)$',

    # src/transport/mod.rs
    #
    # An 8-byte payload is a sender id with an empty message body, which the
    # decoder rejects as InvalidData just as the length check would.
    'replace < with <= in read_frame$',
]
