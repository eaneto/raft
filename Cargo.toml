[package]
name = "raft"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
rand = "0.8.5"
env_logger = "0.11.5"
log = "0.4.22"

[dev-dependencies]
proptest = "1"
# Isolated temp directories with reliable cleanup for the FileStorage tests.
tempfile = "3"

# See AGENTS.md "Coding standards". Levels are `warn` here; `just check`
# and CI promote warnings to errors with `-D warnings`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
