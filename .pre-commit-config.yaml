repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: cargo fmt --check
        entry: just fmt-check
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: just clippy
        language: system
        types: [rust]
        pass_filenames: false
      - id: test
        name: cargo test
        entry: just test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
